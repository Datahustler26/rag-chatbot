version: '3.8'

services:
  # Ollama LLM Service (Local LLM)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_llm
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped
    pull_policy: always

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT_API_KEY=your-api-key
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build: .
    container_name: ragchatbot_backend
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - ollama
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=http://ollama:11434
      - LLM_PROVIDER=ollama
      - OLLAMA_MODEL=llama3
    volumes:
      - ./:/app
    restart: unless-stopped
    command: python -m uvicorn backend.server:app --host 0.0.0.0 --port 8000

volumes:
  qdrant_storage:
    driver: local
  ollama_storage:
    driver: local
